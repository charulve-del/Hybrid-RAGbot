services:

  # ==========================================================
  # NEO4J
  # ==========================================================

  neo4j:

    image: neo4j:5

    container_name: hybrid-rag-neo4j

    environment:

      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}

    ports:

      - "7474:7474"

      - "7687:7687"

    volumes:

      - neo4j_data:/data

      - neo4j_logs:/logs

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

    restart: unless-stopped


  # ==========================================================
  # BACKEND
  # ==========================================================

  backend:

    build:

      context: .

      dockerfile: backend/Dockerfile

    container_name: hybrid-rag-backend

    environment:

      OPENAI_API_KEY: ${OPENAI_API_KEY}

      NEO4J_URI: bolt://neo4j:7687

      NEO4J_USERNAME: neo4j

      NEO4J_PASSWORD: ${NEO4J_PASSWORD}

    depends_on:

      neo4j:

        condition: service_healthy

    volumes:

      - ./data:/app/data

    expose:

      - "8000"

    restart: unless-stopped


  # ==========================================================
  # FRONTEND
  # ==========================================================

  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

    container_name: hybrid-rag-frontend

    depends_on:

      - backend

    ports:

      - "80:80"

    restart: unless-stopped


# ============================================================
# PERSISTENT VOLUMES
# ============================================================

volumes:

  neo4j_data:

  neo4j_logs: